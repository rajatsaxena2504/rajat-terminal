backend:
  name: github
  repo: rajatsaxena2504/rajat-terminal
  branch: main

# For local development, use this instead:
# backend:
#   name: git-gateway
#   branch: main

local_backend: true # Enable local backend for development

media_folder: public/images
public_folder: /images

site_url: https://rajatsaxena2504.github.io/rajat-terminal
display_url: https://rajatsaxena2504.github.io/rajat-terminal

collections:
  - name: blogs
    label: Blog Posts
    folder: src/content/blogs
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Updated Date, name: updatedDate, widget: datetime, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: books
    label: Books
    folder: src/content/books
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string }
      - { label: Rating, name: rating, widget: number, min: 1, max: 5, step: 1 }
      - { label: Date Read, name: dateRead, widget: datetime }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Cover Image, name: image, widget: image, required: false }
      - { label: Amazon Link, name: amazonLink, widget: string, required: false }
      - label: Status
        name: status
        widget: select
        options:
          - { label: Reading, value: reading }
          - { label: Completed, value: completed }
          - { label: Want to Read, value: want-to-read }
        default: completed
      - { label: Notes, name: body, widget: markdown }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Technologies, name: tech, widget: list, default: [] }
      - { label: GitHub URL, name: github, widget: string, required: false }
      - { label: Live URL, name: live, widget: string, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - label: Status
        name: status
        widget: select
        options:
          - { label: Active, value: active }
          - { label: Completed, value: completed }
          - { label: Archived, value: archived }
        default: completed
      - { label: Details, name: body, widget: markdown }

  - name: newsletter
    label: Newsletter
    folder: src/content/newsletter
    create: true
    slug: "issue-{{fields.issue}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Issue Number, name: issue, widget: number }
      - { label: Content, name: body, widget: markdown }
